<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="./src/ar.js" type="module"></script>
    <script src="./src/eventListeners.js" type="module"></script>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>

      <a-scene
      mindar-image="imageTargetSrc: ./targets-final.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets></a-assets>
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET 0 -->
      <a-entity
        id="target0"
        mindar-image-target="targetIndex: 0"
      ></a-entity>

      <!-- TARGET 1 -->
      <a-entity
        id="target1"
        mindar-image-target="targetIndex: 1"
      ></a-entity>

    </a-scene>
      <div class="ui-container">
        <div class="nav">
          <div class="nav-hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="nav-container" id="navMenu">
            <a>Explore AR</a>
            <a href="/rice">Grow your rice</a>
            <a>About</a>
          </div>
        </div>
      </div> 
<!--       <button id="scene1Btn" class="sceneButton">scene1</button>
      <button id="scene2Btn" class="sceneButton">scene2</button>
      <button id="scene3Btn" class="sceneButton">scene3</button> -->
    </body>
  </html>
