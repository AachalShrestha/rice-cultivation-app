<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <title>info page</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="./src/style/info.css">
    <script src="./src/riceStep.js" type="module"></script>
</head>
<body>
    <div id="ar-panel" class="ar-panel">
        <a-scene
            mindar-image="imageTargetSrc: ./targets-final.mind;"
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
            ui-loading="enabled: false"
            ui-scanning="enabled: false"
            id="mindarScene"
        >
            <a-camera 
            position="0 0 0" 
            look-controls="enabled: false"
            fov="10"
            ></a-camera>
        </a-scene>
        <div class="plant-container-cross" id="back-btn">
            <span></span>
             <span></span>
        </div>
        <!-- <button class="back-btn" id="back-btn">Cancel</button> -->
        <div class="ui-scanning active">
            <div class="scanning">
                <div class="inner">
                <div class="scanline"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="wrapper">
        <div class="nav">
            <a href="/">SCAN PANELS</a>
            <a href="/rice">GROW YOUR RICE</a>
            <a>ABOUT</a>
        </div>
        <div class="copy">
            <div>
                <div class="copy1 object">
                    <div class="number copy1-1" >
                       <h1 id="number"></h1>
                    </div>
                    <div class="copy1-2"> 
                       <p id="days"></p> 
                    </div>
                </div>
                <div class="copy2 conditions object" id="conditions">
                </div>
            </div>
            <div class="copy3 object">
                <div class="title">
                    <h1 id="title"></h1>
                </div>
                <div class="description">
                    <p id="description"></p>
                </div>
            </div>
        </div>
        <div class="images">

        </div>
        <img src="/scan-layer-button.png" id="ar-btn" class="ar-btn"/>
        <!-- <button class="ar-btn">Scan a panel</button> -->
    </div>
</body>
</html>
