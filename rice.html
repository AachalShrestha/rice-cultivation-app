<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/src/rice-field.js" type="module"></script>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/style/rice.css">
    <title>Rice-farm</title>
</head>
<body>
    <div class="btns">
        <div class="info">
            <!-- <h1>A shared rice field</h1> -->
        </div>
            <button class="rice-btn plant-btn" role="button" id="plant-btn">
                <p class="plant-btn-inner">
                Plant your seed
                </p>

                <svg class="button-curve" viewBox="0 0 40 80">
                <path d="M10 0 Q40 40 10 80" />
                </svg>
            </button>
        
    </div>
        <div class="ui-container">
            
          <button class="hamburger" id="hamburger">
            <span></span>
            <span></span><span></span>
          </button>

          <div class="nav" id="nav">
            <a href="/">SCAN PANELS</a>
            <a href="/rice.html">PLANT YOUR SEED</a>
            <a href="#">ABOUT</a>
          </div>

        </div>
        </div>
            <div class="confirm-message" id="confirm-message">
           <p> 🌱 Your seed has been planted <br/>
            We’ve sent a confirmation email (check spam if necessary).<br/>

            Take a keychain to stay connected with the rice field.
            </p>
        </div>
    <div class="plant-container" id="plant-container">
        <div class="plant-container-cross" id="plant-container-cross">
            <span></span>
             <span></span>
        </div>

        <div class="plant-input-container">
            <div class="img"><img src="/rice/rice1-1.svg"></div>
            <div class="inputs">
                <input id="nameInput" class="input" placeholder="name" >
                <input id="emailInput" class="input" placeholder="email" type="email">
                <p id="message" class="red">default message</p>
            </div>
            <button class="button plant-seed-btn plant-btn rice-btn" id="plant-seed-btn">Plant <svg class="button-curve" viewBox="0 0 40 80">
                <path d="M10 0 Q40 40 10 80" />
                </svg>
            </button>
            </div>
        </div>
        
        <div class="info-container">
            <h1>The Collective Rice Field</h1>
            <p>Tap a grain to see who planted it and how it has grown.</p>
        </div>
        <div class="zoom-container">
            <p id="zoom-in">+</p>
            <p id="zoom-out">-</p>
        </div>
    </div>
    
    <div id="viewport">
        <div id="world">
        
        </div>
        
    </div>
    
    
</body>
</html>
